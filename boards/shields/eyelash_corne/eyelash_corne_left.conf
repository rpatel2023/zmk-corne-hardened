# Note: CONFIG_ZMK_SLEEP=y is inherited from the shared eyelash_corne.conf.

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# === Studio (Central only) ===
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# === Runtime Input Processor (Central only) ===
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# === Settings RPC (Central only) ===
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# === Runtime Sensor Rotate (Encoder, Central only) ===
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Runtime Combo (Central only) ===
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# === Devtool (Central only) ===
# Event tap only, for physical-key-press selection during keymap editing.
# Key injection, log capture, and stack usage are deliberately left off:
# not needed for that feature, and each is extra capability we don't want
# even with the subsystem now SECURED (see the fork's commit history).
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_EVENT_TAP=y

# LAYER_STATE defaults to on but we don't use it, and devtool_layer.c calls
# zmk_keymap_layer_activate() with a "locking" 2nd argument that doesn't
# exist in this v3.5.0-based zmk core (that parameter is a newer ZMK core
# addition). The whole file is #if IS_ENABLED(CONFIG_ZMK_DEVTOOL_LAYER_STATE)
# guarded, so disabling it removes the incompatible call entirely rather
# than requiring a source patch.
CONFIG_ZMK_DEVTOOL_LAYER_STATE=n

# Shared Studio RPC buffer sizing needed by runtime combo + devtool event tap
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=384
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Replicates a hardware-verified fix from a newer upstream custom-settings
# commit than our pin (see west.yml comment): settings_load() runs on the
# main thread at boot and overflowed the bare 1024-byte default stack with
# a persisted keyspace entry present. Set directly here since the pinned
# commit predates the module declaring this default itself.
CONFIG_MAIN_STACK_SIZE=2048

# === Settings (Central only) ===
CONFIG_SETTINGS=y

# === Battery (Central only) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n

# === Split (Central only) ===
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000