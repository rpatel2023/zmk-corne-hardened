manifest:
  projects:
    # Custom keyboard hardware definitions preserved in this repository.
    - name: eyelash_corne
      url: https://github.com/rpatel2023/zmk-corne-hardened
      revision: 904bf0d97ab188412cd7e0d8644187ee9b67a03f

    # Custom ZMK core required by this keyboard.
    - name: zmk
      url: https://github.com/rpatel2023/zmk-corne-core
      revision: 4493783ef88ce2e653bf8217c92ee17140df71e3
      import: app/west.yml

    - name: zmk-behavior-runtime-sensor-rotate
      url: https://github.com/rpatel2023/zmk-behavior-runtime-sensor-rotate
      revision: a92164d9a57d00e419882f77f4d63f61cdcc184c

    - name: zmk-module-ble-management
      url: https://github.com/rpatel2023/zmk-module-ble-management
      revision: 09fb98fcb9544904e39f851ebf23b5e7068be311

    # Re-pinned to pick up the SECURED fix (was left UNSECURED at the
    # previous pin, unlike every other custom RPC module here).
    - name: zmk-module-battery-history
      url: https://github.com/rpatel2023/zmk-module-battery-history
      revision: c6b63d17d86ed3cdcd8ecc944a4219d546e1cbfe

    - name: zmk-module-settings-rpc
      url: https://github.com/rpatel2023/zmk-module-settings-rpc
      revision: a9f868453a5ddd070733dccb8797c2687a6629a1

    - name: zmk-module-runtime-input-processor
      url: https://github.com/rpatel2023/zmk-module-runtime-input-processor
      revision: 5971adf0e2fa8295a0cb371cbd1f7d76e9c3b7b3

    # Runtime combo editing (SetCombo/DeleteCombo/etc RPC). Fork of
    # cormoran/zmk-feature-runtime-combo, patched to SECURED (was unsecured
    # upstream). Transitively imports zmk-feature-custom-settings below.
    - name: zmk-feature-runtime-combo
      url: https://github.com/rpatel2023/zmk-feature-runtime-combo
      revision: e1b98fea9705bb38fc899eb7c969fbeaa4b2bf42
      import: true

    # Explicit pin so it doesn't fall back to whatever revision
    # zmk-feature-runtime-combo's own manifest happens to import. Fork of
    # cormoran/zmk-feature-custom-settings on the v3.5-compat branch,
    # patched to SECURED. Pinned to the last upstream commit *before*
    # "Split setting descriptors into const flash meta + compact RAM
    # state" (d1b664434a), which started using zephyr_linker_sources(
    # ROM_SECTIONS ...) -- a location keyword that doesn't exist before
    # Zephyr v4.1 (our zmk core uses v3.5.0+zmk-fixes). Verified this
    # commit still has every API runtime-combo calls (array/behavior
    # setting macros, save/discard scope, etc). Cost: the MAIN_STACK_SIZE
    # boot-stack-overflow fix from a later upstream commit isn't present
    # here since it's a plain Kconfig default -- replicated directly via
    # CONFIG_MAIN_STACK_SIZE in eyelash_corne_left.conf instead.
    - name: zmk-feature-custom-settings
      url: https://github.com/rpatel2023/zmk-feature-custom-settings
      revision: e953267296755769c82cac2a5dfbb34af050b813

    # Devtool module (position/keycode event tap) for physical-key-press
    # selection during keymap editing. Fork of cormoran/zmk-module-devtool,
    # patched to SECURED (was unsecured upstream, including reboot/
    # bootloader-entry and, if enabled, key injection and event tap).
    - name: zmk-module-devtool
      url: https://github.com/rpatel2023/zmk-module-devtool
      revision: 6785c2e78eb8eb447a82557e67f2babac819ec4c

  self:
    path: config
